name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # NOTE: this repo intentionally does NOT commit package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage
